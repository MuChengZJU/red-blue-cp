<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RBCP Desktop · 三形态速览</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Red Blue CP · 一竖屏读懂</h1>
    <div class="controls">
      <label class="switch">
        <input type="checkbox" id="only-highlights" />
        只看高亮
      </label>
      <button id="run-sidecar" title="联调期调 PyInstaller sidecar 跑引擎">▶ 跑引擎</button>
      <span id="sha-banner"></span>
    </div>
  </header>

  <main id="three-forms" class="grid">
    <section id="col-fulltext" class="col">
      <div class="col-head">① 全文 · 重点高亮（点高亮跳读）</div>
      <div class="col-body"></div>
    </section>
    <section id="col-cards" class="col">
      <div class="col-head">② 卡片 · 金句</div>
      <div class="col-body"></div>
    </section>
    <section id="col-outline" class="col">
      <div class="col-head">③ 脉络 · 大纲</div>
      <div class="col-body"></div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>

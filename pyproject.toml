[project]
name = "red-blue-cp"
version = "0.1.0"
description = "B站小红书 Content Pipeline — URL to Markdown"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "ffmpeg-python",
    "python-dotenv",
    "fastapi",
    "uvicorn",
    "jinja2",
    "typer",
]

[project.scripts]
rbcp = "app.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest", "httpx"]

[project]
name = "red-blue-cp"
version = "0.5.2"
description = "B站小红书 Content Pipeline — URL to Markdown"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MuChengZJU" }]
keywords = ["bilibili", "xiaohongshu", "transcript", "markdown", "knowledge-base", "asr", "content-pipeline"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Topic :: Text Processing",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests",
    "ffmpeg-python",
    "python-dotenv",
    "fastapi",
    "uvicorn",
    "jinja2",
    "typer",
    "pydoll-python", # P1：博主全量/评论用，CDP 连系统 Chrome 拦截接口；discover.py 内懒加载
    "platformdirs>=4.10.0",
]

[project.urls]
Homepage = "https://github.com/MuChengZJU/red-blue-cp"
Repository = "https://github.com/MuChengZJU/red-blue-cp"
Issues = "https://github.com/MuChengZJU/red-blue-cp/issues"

[project.scripts]
rbcp = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 包名 red-blue-cp 对不上目录名 app，需显式告诉 hatchling 打哪个包。
# templates/*.html、*.md.j2 等非 .py 文件在包目录内，hatchling 默认一并打进 wheel。
[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest", "httpx"]

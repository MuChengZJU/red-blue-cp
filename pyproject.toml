[project]
name = "red-blue-cp"
version = "0.1.0"
description = "B站小红书 Content Pipeline — URL to Markdown"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "ffmpeg-python",
    "python-dotenv",
    "fastapi",
    "uvicorn",
    "jinja2",
    "typer",
    "pydoll-python",  # P1：博主全量/评论用，CDP 连系统 Chrome 拦截接口；discover.py 内懒加载
]

[project.scripts]
rbcp = "app.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest", "httpx"]

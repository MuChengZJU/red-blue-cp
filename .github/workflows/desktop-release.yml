name: Desktop Release

# 云端构建桌面端二进制：macOS arm64 (.dmg) + Windows x64 (.exe)。
#
# 触发：
#   - 打 tag v* 时自动构建并把产物上传到对应的 GitHub Release（与 publish.yml 各管各的，
#     publish.yml 发 PyPI，本工作流发桌面端二进制）。
#   - 手动 workflow_dispatch：只产 artifact 供下载测试，不动 Release（不带 tag）。
#
# ⚠️ Windows 产物当前「能构建 ≠ 已验证」：引擎的 ffmpeg / 路径 / %APPDATA% 配置发现
#    尚未在 Windows 上实测过。CI 只保证打得出包；真链路能否跑通需实机点验。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # tag 触发时把产物上传到 Release 需要

jobs:
  macos:
    runs-on: macos-14   # Apple Silicon → aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build sidecar (rbcp-serve)
        working-directory: desktop/sidecar
        run: bash build.sh
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.0" --locked
      - name: Build app (.dmg)
        working-directory: desktop/src-tauri
        run: cargo tauri build --bundles dmg
      - name: Rename asset
        run: |
          src=$(ls desktop/src-tauri/target/release/bundle/dmg/*.dmg)
          cp "$src" "RBCP-Desktop-${GITHUB_REF_NAME#v}-macos-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: "*.dmg"
      - name: Upload to Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.dmg"

  windows:
    runs-on: windows-latest   # x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build sidecar (rbcp-serve.exe)
        shell: bash
        working-directory: desktop/sidecar
        run: |
          uv venv --python 3.13 .venv
          PY="$PWD/.venv/Scripts/python.exe"
          uv pip install --python "$PY" -e "$GITHUB_WORKSPACE" pyinstaller
          # Windows 下 --add-data 分隔符是 ';'（mac/Linux 是 ':'）
          "$PWD/.venv/Scripts/pyinstaller.exe" --onefile --name rbcp-serve \
            --paths "$GITHUB_WORKSPACE" \
            --add-data "$GITHUB_WORKSPACE/app/web/templates;app/web/templates" \
            --add-data "$GITHUB_WORKSPACE/app/extract/templates;app/extract/templates" \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan.on \
            --exclude-module pydoll \
            --clean --noconfirm serve_entry.py
          mkdir -p ../src-tauri/binaries
          cp dist/rbcp-serve.exe ../src-tauri/binaries/rbcp-serve-x86_64-pc-windows-msvc.exe
      - name: Sidecar smoke test (起 serve + 打一下)
        shell: bash
        run: |
          # sidecar 绑随机端口，stdout 某行吐 {"port":...,"token":...}（见 serve_entry.py）。
          # 注意：uvicorn 的 INFO 日志排在 JSON 前，且重定向到文件是块缓冲——
          # 故 PYTHONUNBUFFERED=1 立即刷新 + grep 整个文件（别只读首行）。
          BIN="desktop/src-tauri/binaries/rbcp-serve-x86_64-pc-windows-msvc.exe"
          PYTHONUNBUFFERED=1 "$BIN" > sidecar.log 2>&1 &
          SVPID=$!
          PORT=""
          for i in $(seq 1 45); do
            PORT=$(grep -o '"port"[^0-9]*[0-9][0-9]*' sidecar.log 2>/dev/null | grep -o '[0-9][0-9]*' | tail -n1)
            [ -n "$PORT" ] && break
            sleep 1
          done
          OK=0
          if [ -n "$PORT" ] && curl -sf "http://127.0.0.1:$PORT/" >/dev/null 2>&1; then
            echo "serve up on port $PORT"; OK=1
          fi
          kill $SVPID 2>/dev/null || true
          echo "----- sidecar.log -----"; cat sidecar.log || true
          if [ "$OK" != "1" ]; then echo "::warning::Windows sidecar 未在 30s 内起来/响应（仅警告，不阻断构建——Windows 引擎尚未验证）"; fi
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.0" --locked
      - name: Build app (.exe / NSIS)
        working-directory: desktop/src-tauri
        run: cargo tauri build --bundles nsis
      - name: Rename asset
        shell: bash
        run: |
          src=$(ls desktop/src-tauri/target/release/bundle/nsis/*.exe)
          cp "$src" "RBCP-Desktop-${GITHUB_REF_NAME#v}-windows-x64-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: "*.exe"
      - name: Upload to Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.exe"
